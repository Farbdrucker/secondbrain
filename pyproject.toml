[project]
name = "secondbrain"
version = "0.1.0"
description = "Telegram knowledge bot: collect links and notes, summarize and tag them into a Markdown wiki"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
    "python-slugify>=8.0",
    "tzdata",
    "yt-dlp[default]>=2026.8.19",
    "faster-whisper>=1.2.1",
    "pymupdf>=1.28.2",
    "deno>=2.9.7",
    "av<16",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
